<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Publisher Button Example</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .demo-container {
      margin-bottom: 40px;
    }
  </style>
  <script async defer src="/examples/sample-pub/redirect-to/publisher.js"></script>
</head>
<body>
  <h1>Publisher Button Examples</h1>
  
  <div class="demo-container">
    <h2>1. English, Light Theme (Default)</h2>
    <div google-add-preferred-source-btn data-lang="en"></div>
  </div>

  <div class="demo-container">
    <h2>2. Spanish, Dark Theme</h2>
    <div google-add-preferred-source-btn data-lang="es" data-theme="dark"></div>
  </div>

  <div class="demo-container">
    <h2>3. German (DE), Light Theme (Default)</h2>
    <div google-add-preferred-source-btn data-lang="de"></div>
  </div>

  <div class="demo-container">
    <h2>4. French (FR), Dark Theme</h2>
    <div google-add-preferred-source-btn data-lang="fr" data-theme="dark"></div>
  </div>

  <div class="demo-container">
    <h2>4. Centered Container (width: fit-content; margin: 0 auto;)</h2>
    <div style="margin: 0 auto; width: fit-content; border: 1px dashed #ccc; padding: 8px;">
      <div google-add-preferred-source-btn data-lang="en"></div>
    </div>
  </div>

  <div class="demo-container">
    <h2>5. Flex Row / Multi-Button Toolbar</h2>
    <div style="display: flex; gap: 12px; align-items: center;">
      <button style="padding: 10px 16px; border-radius: 100px; border: 1px solid #1a73e8; background: #1a73e8; color: white; cursor: pointer; font-weight: 500;">Subscribe</button>
      <span google-add-preferred-source-btn data-lang="en"></span>
    </div>
  </div>

</body>
</html>
